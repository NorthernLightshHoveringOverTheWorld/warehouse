spring.application.name=warehouse
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/warehouse}
spring.datasource.username=${DB_USER:warehouse}
spring.datasource.password=${DB_PASSWORD:warehouse_local}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}
server.error.include-message=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
